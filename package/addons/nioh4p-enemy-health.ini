[nioh4p]
; 0 installs no hooks. Changes take effect on the next launch.
enabled=1

; Enemy maximum HP in percent of the stock value, 25 to 400.
; 100 keeps stock HP. Repeated status updates do not stack the multiplier.
; An update keeps a wounded enemy's current HP, capped at its new maximum.
; In a session the lobby host's value wins.
; Enemies created before the hook is ready change on their next status update.
enemy_hp_percent=100
