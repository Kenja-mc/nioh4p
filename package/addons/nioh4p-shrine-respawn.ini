[nioh4p]
; 0 installs no hooks. Changes take effect on the next launch.
enabled=1

; 1 = in a three- or four-player Tokoyo session, a player who chooses native
; self-recovery after lethal damage returns to the last shrine that player
; used, through the game's own respawn transition. 0 keeps the shipped
; body-position respawn. Installing this add-on opts in, so the default is 1.
; Teammate rescue is unchanged. When no used shrine is known, the shrine id is
; missing from the role tree, or the native setter is not decrypted yet, the
; body position is kept and the log says why. The shrine id is read from the
; native checkpoint the game itself uses; matching ids do not prove the
; checkpoint is fresh for the current mission.
respawn_at_shrine=1
