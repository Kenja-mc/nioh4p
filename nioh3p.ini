; nioh3p settings.
;
; This file sits next to dinput8.dll in the game folder. The game reads it at
; start. The capacity values are the ones used in the three-player test. The
; search filters below stay at the stock game behavior.
; These values are also the built-in defaults. A missing line behaves exactly
; like the line written here.
;
; The mod writes the log next to dinput8.dll. If it cannot, the log goes to the
; temp folder instead (%TEMP%\nioh3p.log on Windows).

; How many players a mission can hold. Allowed values: 0 (the mod clamps
; nothing) or 2 to 4. 3 means the host plus two visitors. The mod replaces any
; other value with 3.
max_players=3

; 1 = patch the game's online lobby hooks. This is the mod itself.
hook_eos=1

; Visitor-side filters for the game's own lobby search.
; 0 = keep both filters, exactly as in the unmodded game. A session stays
;     hidden from the visitor search when the host has locked it ("Summon
;     Visitor" active) or when it has no free slots. This is the default and
;     the shipped value.
; 1 = the visitor search ignores one filter, so locked or full sessions still
;     appear. Use this only as a workaround when a host cannot be found. A
;     group that plays together normally does not need it.
; force_unlock=1 below is the host-side alternative. The host advertises the
; session as unlocked. This replaces the visitor-side workaround.
drop_lock_filter=0

; See the comment above drop_lock_filter. This one is the "free slots" filter.
drop_slots_filter=0

; Host-side option: advertise the session as unlocked. Not needed. Kept off.
force_unlock=0

; Where the mod writes the log file.
; Empty = next to dinput8.dll in the game folder (recommended).
; Examples: C:\nioh3p-logs on Windows, or Z:\home\me\nioh3p-out on Linux. A
; Windows drive letter points at a Linux folder.
out_dir=

; ---------------------------------------------------------------------------
; Developer options. Leave these values as they are.
; These options exist to investigate the game, not to play it. With all of
; them at 0, the mod only writes nioh3p.log.
; ---------------------------------------------------------------------------

; 1 = save copies of the game code from memory to the log folder.
dump_image=0

; With dump_image=1: seconds to wait before a second copy (0 = none).
redump_after_s=0

; With dump_image=1: seconds between further copies (0 = off).
dump_every_s=0

; 1 = write every hooked online call to the log. The log becomes very large
; and the game slows down.
trace=0
