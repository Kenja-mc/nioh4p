; nioh3p settings.
;
; This file sits next to dinput8.dll in the game folder and is read when the
; game starts. The capacity values are the ones a three-player game was tested
; with; the search filters below stay at the game's stock behaviour.
; (These are also the mod's built-in defaults, so a missing line behaves exactly
; like the line written here.)
;
; The log is written next to dinput8.dll. If that is not possible, it goes to
; the temp folder instead (%TEMP%\nioh3p.log on Windows).

; How many players a mission can hold. Allowed: 0 (the mod's clamps are off)
; or 2 to 4. 3 = the host plus two visitors. Any other value is replaced by 3.
max_players=3

; 1 = patch the game's online lobby hooks (this is the mod itself).
hook_eos=1

; Visitors: the game's own lobby search filters.
; 0 = keep both filters, exactly as in the unmodded game: a session that the
;     host has locked ("Summon Visitor" active) or that has no free slots stays
;     hidden from the visitors' search. This is the default and what is shipped.
; 1 = let the visitor's search ignore a filter, so locked or full sessions still
;     appear. Only needed as a workaround when a host cannot be found; a group
;     that plays together normally does not need it.
; force_unlock=1 below is the host-side alternative: the host advertises the
; session as unlocked instead of the visitors ignoring the lock filter.
drop_lock_filter=0

; See the comment above drop_lock_filter. This one is the "free slots" filter.
drop_slots_filter=0

; Host: advertise the session as unlocked. Not needed, kept off.
force_unlock=0

; Where the log file is written.
; Empty = next to dinput8.dll in the game folder (recommended).
; Examples: C:\nioh3p-logs on Windows, or Z:\home\me\nioh3p-out on Linux
; (a Windows drive letter pointing at a Linux folder).
out_dir=

; ---------------------------------------------------------------------------
; Developer options - leave as is.
; These exist for investigating the game, not for playing it. With all of them
; at 0 the mod only writes nioh3p.log.
; ---------------------------------------------------------------------------

; 1 = save copies of the game's code from memory to the log folder.
dump_image=0

; With dump_image=1: seconds to wait before taking a second copy (0 = none).
redump_after_s=0

; With dump_image=1: seconds between further copies (0 = off).
dump_every_s=0

; 1 = write every hooked online call to the log (very large, slows the game).
trace=0
